services:
  - type: web
    name: meme-machine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: GIPHY_API_KEY
        sync: false
